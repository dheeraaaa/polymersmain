server:
  port: ${PORT:4000}
spring:
  application:
    name: stockai-backend
  data:
    mongodb:
      uri: ${MONGODB_URI}
  jackson:
    default-property-inclusion: non_null
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
app:
  jwt-secret: ${JWT_SECRET:local-development-secret-change-before-production}
  jwt-expiry-seconds: ${JWT_EXPIRY_SECONDS:28800}
  cors-origin: ${CORS_ORIGIN:http://localhost:3000}
